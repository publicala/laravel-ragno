name: Tests

# Reusable body for the PHP/Laravel test matrix. The orchestrator (ci.yml) owns
# the event routing and the needs DAG. This file carries only the job body so
# the orchestrator stays readable.

on:
  workflow_call:

jobs:
  test:
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP (static + pcov)
        uses: publicala/php-ci-static@a5c8319fbd0616bd8a707464f1b755e63aa31bed # v1
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --no-interaction --prefer-dist

      - name: Pint + Rector (check only)
        run: composer run-script test:lint

      - name: PHPStan (level 8)
        run: composer run-script test:types

      - name: Type coverage (100%)
        run: composer run-script test:type-coverage

      - name: Code coverage (100%)
        run: composer run-script test:coverage
