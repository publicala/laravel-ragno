name: CI

# Single workflow for the whole automated pipeline: the test matrix, the
# changelog-driven release checks, and the release cut itself.
#
# Why one file: branch rulesets require a single status check, and a `needs`
# graph cannot span separate workflow files. Keeping every job here lets the
# aggregate `ci-success` gate depend on all of them and lets `release` depend
# on that gate, so a red CI run can never publish a release.
#
# Trigger scoping: the `test` matrix runs on every push to main and every PR,
# so the workflow-level `on:` carries no path filters. The release-family jobs
# (validate / guard-changelog-bump / release) were previously scoped to a
# subset of paths via their own workflow's `on.*.paths`. That per-path scoping
# is reproduced here with the `changes` job plus job-level `if` conditions, so
# none of these jobs runs in a context it did not run in before.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Unchanged from the previous CI workflow: every push to main and every PR.
    # Never on workflow_dispatch, which the old CI workflow did not expose.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        laravel: ['12.*', '13.*']
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP (static + pcov)
        uses: publicala/php-ci-static@50abac408049f969e9fc93cdaf1e33a9082509e2 # v1
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Install dependencies
        run: |
          composer require --no-interaction --no-update \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --no-interaction --prefer-dist

      - name: Pint + Rector (check only)
        run: composer run-script test:lint

      - name: PHPStan (level 8)
        run: composer run-script test:types

      - name: Type coverage (100%)
        run: composer run-script test:type-coverage

      - name: Code coverage (100%)
        run: composer run-script test:coverage

  changes:
    # Reproduces the path scoping the release-family jobs used to get from their
    # own workflow's `on.*.paths`. Now that those jobs live alongside `test`
    # (which must run on every path), path scoping moves into a per-job `if`
    # fed by these outputs. Skipped on workflow_dispatch, where there is no
    # diff base and the release-family jobs gate on the event instead.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    outputs:
      # Old `on.push.paths` for the release workflow (release.yml renamed to
      # ci.yml here): a changelog edit or a workflow edit.
      changelog_or_workflow: ${{ steps.filter.outputs.changelog_or_workflow }}
      # Extra paths the old `on.pull_request.paths` added on top: the package
      # surface that must be matched by a changelog bump.
      package_surface: ${{ steps.filter.outputs.package_surface }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            changelog_or_workflow:
              - 'CHANGELOG.md'
              - '.github/workflows/ci.yml'
            package_surface:
              - 'src/**'
              - 'composer.json'

  validate:
    name: Validate changelog header
    # Old contexts: push to main touching CHANGELOG/workflow, any PR touching
    # CHANGELOG/src/composer/workflow, or a manual dispatch.
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && needs.changes.outputs.changelog_or_workflow == 'true')
      || (github.event_name == 'pull_request' && (needs.changes.outputs.changelog_or_workflow == 'true' || needs.changes.outputs.package_surface == 'true'))
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check top header shape
        run: |
          set -euo pipefail
          header=$(grep -m1 -E '^## ' CHANGELOG.md || true)
          if [[ -z "$header" ]]; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no '## ' header"
            exit 1
          fi
          if ! [[ "$header" =~ ^##\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=CHANGELOG.md::Top header must be '## vX.Y.Z' exactly (got: $header)"
            exit 1
          fi
          echo "OK: $header"

  guard-changelog-bump:
    name: Guard CHANGELOG bump when source changes
    # Old context: PRs only, scoped to CHANGELOG/src/composer/workflow paths.
    needs: changes
    if: >-
      github.event_name == 'pull_request'
      && (needs.changes.outputs.changelog_or_workflow == 'true' || needs.changes.outputs.package_surface == 'true')
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need both PR head and base for the diff and the base-CHANGELOG read.
          fetch-depth: 0

      - name: Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA...HEAD" -- src/ composer.json)
          if [[ -z "$changed" ]]; then
            echo "No src/ or composer.json changes in this PR — bump guard not applicable."
            exit 0
          fi
          echo "PR modifies the package surface:"
          printf '  - %s\n' $changed

          head_version=$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+$' CHANGELOG.md | sed 's/^## v//')
          # `git show base:CHANGELOG.md` reads the file as it stood on the PR base.
          base_version=$(git show "$BASE_SHA:CHANGELOG.md" \
            | grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^## v//')

          echo "Top version on base ($BASE_SHA): v$base_version"
          echo "Top version on PR head:          v$head_version"

          if [[ "$head_version" == "$base_version" ]]; then
            echo "::error file=CHANGELOG.md::Package surface changed but the top CHANGELOG header is still v$head_version. Add a new '## vX.Y.Z' block at the top of CHANGELOG.md (see the Versioning section at the bottom for the semver rules) so the release workflow can publish your change."
            exit 1
          fi

          # Strict monotonic check: head must be strictly greater than base in
          # semver order. Catches downgrades (`v0.2.1` -> `v0.2.0`) that would
          # otherwise slip through `head != base`. `sort -V` does the right
          # thing on plain `X.Y.Z`.
          newest=$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -1)
          if [[ "$newest" != "$head_version" ]]; then
            echo "::error file=CHANGELOG.md::Top CHANGELOG version went backwards: base is v$base_version, PR sets v$head_version. The release flow only moves forward — bump the version above v$base_version."
            exit 1
          fi
          echo "OK: bumped v$base_version -> v$head_version"

  # Aggregate gate: the single status check branch rulesets require.
  # It needs every automated CI job and reports one pass or fail, so the
  # ruleset never changes when a CI job is renamed or added. Runs on job
  # failure and skip but not when the run is cancelled, so cancelled runs
  # report as cancelled instead of failed.
  #
  # `changes` is deliberately NOT in this gate's needs: it is a trigger router
  # (it only computes path-filter outputs to scope the release family), not an
  # automated test whose failure should block a merge. The `release` job needs
  # `changes` solely for its output; the gate aggregates the real test and
  # validation jobs.
  ci-success:
    if: ${{ !cancelled() }}
    needs: [test, validate, guard-changelog-bump]
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          # These jobs are path/event scoped, so they legitimately skip on runs
          # that do not touch their paths (or on workflow_dispatch, where the
          # test matrix does not run). A skip is treated as success; a real
          # failure still fails the gate.
          allowed-skips: test, validate, guard-changelog-bump
          jobs: ${{ toJSON(needs) }}

  release:
    name: Cut release
    # Wired to need the aggregate gate so a red CI run can never publish a
    # release. `ci-success` reports success only when every CI job it
    # aggregates passed (or legitimately skipped), and it transitively covers
    # `validate`, so requiring `ci-success == success` also guarantees the
    # changelog header validated. `changes` is needed only for its output.
    needs: [changes, ci-success]
    # Hard-gate to main only. Without the ref check, a maintainer dispatching
    # the workflow from a feature branch would publish vX.Y.Z from unmerged
    # code. On push, the old release workflow's `on.push.paths` scoping (cut
    # only when CHANGELOG/workflow changed) is reproduced through the `changes`
    # job; dispatch keeps running regardless of paths, as before.
    #
    # `!cancelled()` is required so this job is still evaluated when `changes`
    # is skipped (it only runs on push/pull_request). Without a status function
    # in the `if`, a skipped dependency would silently skip the release on
    # workflow_dispatch — a regression versus the old standalone release flow.
    # The explicit `needs.ci-success.result == 'success'` keeps the green-CI
    # gate intact under that `!cancelled()` relaxation.
    if: >-
      !cancelled()
      && needs.ci-success.result == 'success'
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'workflow_dispatch'
          || (github.event_name == 'push' && needs.changes.outputs.changelog_or_workflow == 'true'))
    runs-on: depot-ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so we can peel vX.Y.Z to its introduction commit locally.
          fetch-depth: 0

      - name: Read top version
        id: ver
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+$' CHANGELOG.md | sed 's/^## v//')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Top version: v$version"

      - name: Find introduction commit for this version
        id: intro
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Walk CHANGELOG.md history oldest→newest. The introduction commit
          # is the first one where the top `## vX.Y.Z` header equals VERSION
          # (i.e., the transition from "previous version at top" to "VERSION
          # at top"). This lets workflow_dispatch on main cut a release for a
          # version whose merge commit is no longer HEAD — necessary because
          # the safety gate restricts the job to refs/heads/main, and
          # `--ref <older-commit>` would otherwise be blocked.
          release_sha=""
          prev=""
          while IFS= read -r sha; do
            v=$(git show "$sha:CHANGELOG.md" 2>/dev/null \
              | grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sed 's/^## v//' || true)
            if [[ -z "$v" ]]; then continue; fi
            if [[ "$prev" != "$VERSION" && "$v" == "$VERSION" ]]; then
              release_sha=$sha
            fi
            prev=$v
          done < <(git log --reverse --format=%H -- CHANGELOG.md)

          if [[ -z "$release_sha" ]]; then
            echo "::error file=CHANGELOG.md::Could not find commit where v$VERSION was introduced at the top of CHANGELOG.md. Aborting."
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "Release commit for v$VERSION: $release_sha"

      - name: Check immutable tag state
        id: tag
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_SHA: ${{ steps.intro.outputs.sha }}
        run: |
          set -euo pipefail
          # Three outcomes, compared against the introduction commit (not
          # GITHUB_SHA, since dispatches on main may run from HEAD past the
          # release commit):
          #   absent            → create the tag at RELEASE_SHA
          #   present_here      → tag already at RELEASE_SHA. Reconcile
          #                       downstream artifacts (release).
          #                       Partial-failure recovery path.
          #   present_elsewhere → tag exists at a different commit. This is
          #                       an out-of-band state we don't want to
          #                       paper over → no-op the whole job.
          if ! git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "state=absent" >> "$GITHUB_OUTPUT"
            echo "v$VERSION does not exist yet — will create at $RELEASE_SHA."
            exit 0
          fi
          tag_commit=$(git rev-list -n 1 "v$VERSION")
          if [[ "$tag_commit" == "$RELEASE_SHA" ]]; then
            echo "state=present_here" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already at $RELEASE_SHA — reconciling downstream artifacts."
          else
            echo "state=present_elsewhere" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already at $tag_commit (introduction commit is $RELEASE_SHA) — out-of-band state, no-op."
          fi

      - name: Extract release notes
        if: steps.tag.outputs.state != 'present_elsewhere'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## / {
              if (capture) exit
              if ($0 == "## v" ver) { capture = 1; next }
            }
            capture { print }
          ' CHANGELOG.md \
            | awk 'NF { found=1 } found' \
            | awk '{ lines[NR] = $0 } END { last = NR; while (last > 0 && lines[last] == "") last--; for (i = 1; i <= last; i++) print lines[i] }' \
            > release-notes.md
          echo "::group::release-notes.md"
          cat release-notes.md
          echo "::endgroup::"

      - name: Create immutable tag
        if: steps.tag.outputs.state == 'absent'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          RELEASE_SHA: ${{ steps.intro.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION" "$RELEASE_SHA"
          git push origin "v$VERSION"
          echo "Tagged v$VERSION at $RELEASE_SHA"

      - name: Create GitHub Release
        if: steps.tag.outputs.state != 'present_elsewhere'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — no-op"
            exit 0
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md
          echo "Published release v$VERSION"
