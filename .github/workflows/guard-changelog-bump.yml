name: Guard changelog bump

# Reusable body for the changelog-bump guard. The orchestrator (ci.yml) owns the
# event routing and the needs DAG. This file carries only the job body so the
# orchestrator stays readable.

on:
  workflow_call:

jobs:
  guard-changelog-bump:
    name: Guard CHANGELOG bump when source changes
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Need both PR head and base for the diff and the base-CHANGELOG read.
          fetch-depth: 0

      - name: Check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE_SHA...HEAD" -- src/ composer.json)
          if [[ -z "$changed" ]]; then
            echo "No src/ or composer.json changes in this PR — bump guard not applicable."
            exit 0
          fi
          echo "PR modifies the package surface:"
          printf '  - %s\n' $changed

          head_version=$(grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+$' CHANGELOG.md | sed 's/^## v//')
          # `git show base:CHANGELOG.md` reads the file as it stood on the PR base.
          base_version=$(git show "$BASE_SHA:CHANGELOG.md" \
            | grep -m1 -E '^## v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^## v//')

          echo "Top version on base ($BASE_SHA): v$base_version"
          echo "Top version on PR head:          v$head_version"

          if [[ "$head_version" == "$base_version" ]]; then
            echo "::error file=CHANGELOG.md::Package surface changed but the top CHANGELOG header is still v$head_version. Add a new '## vX.Y.Z' block at the top of CHANGELOG.md (see the Versioning section at the bottom for the semver rules) so the release workflow can publish your change."
            exit 1
          fi

          # Strict monotonic check: head must be strictly greater than base in
          # semver order. Catches downgrades (`v0.2.1` -> `v0.2.0`) that would
          # otherwise slip through `head != base`. `sort -V` does the right
          # thing on plain `X.Y.Z`.
          newest=$(printf '%s\n%s\n' "$base_version" "$head_version" | sort -V | tail -1)
          if [[ "$newest" != "$head_version" ]]; then
            echo "::error file=CHANGELOG.md::Top CHANGELOG version went backwards: base is v$base_version, PR sets v$head_version. The release flow only moves forward — bump the version above v$base_version."
            exit 1
          fi
          echo "OK: bumped v$base_version -> v$head_version"
